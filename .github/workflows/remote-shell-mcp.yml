# ---------------------------------------------------------------------------
# Temporary remote MCP shell on a GitHub-hosted runner  (LinkPulse edition)
#
# Repo:   github.com/Avinash99b/MCP-Android-Compiler
# Serve:  github.com/Avinash99b/Remote-Shell-MCP   (mcp_shell_server.py)
# Tunnel: github.com/Avinash99b/LinkPulse          (my_proxy client) - NOT cloudflare
#
# FLOW
#   1. Runner starts: Linux 4 vCPU / 16 GB RAM / 14 GB SSD. Free + unlimited
#      minutes on PUBLIC repositories.
#   2. Remote-Shell-MCP is started on 127.0.0.1:8765 with `--no-auth`
#      (explicitly requested: no bearer token).
#   3. The LinkPulse client opens an OUTBOUND-only multiplexed connection to
#      the LinkPulse control server and requests the fixed subdomain from the
#      `subdomain` input. Result: https://<subdomain>.<domain>/mcp
#      REQUIRED because GitHub-hosted runners have NO inbound endpoint at all.
#   4. The public URL is verified end-to-end with a real MCP `initialize` POST.
#   5. The URL is pushed to your phone (MacroDroid webhook) + job summary.
#   6. The job idles for `duration_minutes`. GitHub hard-kills hosted jobs at
#      360 minutes, so the workflow caps itself at 355.
#
# SECRETS (never committed - set in repo Settings > Secrets and variables > Actions)
#   LINKPULSE_TOKEN           REQUIRED  shared secret from ~/.config/linkpulse/authtoken.json
#   LINKPULSE_SERVER          optional  control server host:port
#                                       (default: <linkpulse-host>:9000)
#   MACRODROID_WEBHOOK_URL    optional  phone notifications for the URL
#
# SECURITY NOTE (deliberate, per owner's request): the MCP endpoint is exposed
# WITHOUT authentication on a FIXED, guessable hostname. Anyone who knows the
# URL gets a shell on the runner. Keep sessions short and delete run logs.
# ---------------------------------------------------------------------------

name: remote-shell-mcp

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes to keep the runner alive (max 350; GitHub kills hosted jobs at 360)"
        required: true
        default: "120"
      subdomain:
        description: "LinkPulse subdomain to request (must be free; becomes https://<sub>.<domain>)"
        required: true
        default: "mcp-android-compiler"
      notify_phone:
        description: "Send the public URL to the MacroDroid webhook"
        type: boolean
        default: true

# One runner at a time: a fixed subdomain can only be held by one client.
concurrency:
  group: remote-shell-mcp
  cancel-in-progress: false

# The exposed shell runs with --no-auth, so it must not hold any GitHub credential.
permissions: {}

env:
  LINKPULSE_VERSION: v0.1.4      # latest release of Avinash99b/LinkPulse
  MCP_PORT: "8765"

jobs:
  serve:
    runs-on: ubuntu-latest        # ubuntu-slim = 1 CPU unprivileged container, minimal image
    timeout-minutes: 355          # < the 360-minute hard limit for GitHub-hosted jobs

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start MCP server (--no-auth) and LinkPulse tunnel
        id: tunnel
        env:
          LINKPULSE_TOKEN: ${{ secrets.LINKPULSE_TOKEN }}
          LINKPULSE_SERVER: ${{ secrets.LINKPULSE_SERVER }}
          NOTIFY: ${{ inputs.notify_phone }}
          WEBHOOK: ${{ secrets.MACRODROID_WEBHOOK_URL }}
          SUB_INPUT: ${{ inputs.subdomain }}
        run: |
          set -euo pipefail
          mkdir -p ws && cd ws

          if [ -z "${LINKPULSE_TOKEN:-}" ]; then
            echo "::error::Secret LINKPULSE_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # --- server/domain resolution -------------------------------------
          SERVER="${LINKPULSE_SERVER:-<linkpulse-host>:9000}"
          DOMAIN="${SERVER%%:*}"                    # <linkpulse-host>
          SUB="${SUB_INPUT:-mcp-android-compiler}"
          PUBLIC_URL="https://${SUB}.${DOMAIN}"
          echo "control server : $SERVER"
          echo "public URL     : $PUBLIC_URL/mcp"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

          # --- LinkPulse client ---------------------------------------------
          curl -fsSL -o linkpulse \
            "https://github.com/Avinash99b/LinkPulse/releases/download/${LINKPULSE_VERSION}/my_proxy-linux-amd64"
          chmod +x linkpulse
          ./linkpulse --help >/dev/null   # fail fast if the binary is unusable
          export MY_PROXY_SERVER="$SERVER"
          export MY_PROXY_TOKEN="$LINKPULSE_TOKEN"

          # --- Remote-Shell-MCP, no auth ------------------------------------
          git clone --depth 1 https://github.com/Avinash99b/Remote-Shell-MCP.git server
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet --disable-pip-version-check -r server/requirements.txt

          nohup ./.venv/bin/python server/mcp_shell_server.py \
            --host 127.0.0.1 --port "$MCP_PORT" \
            --no-auth \
            --allowed-host "${SUB}.${DOMAIN}" \
            --cwd "$PWD" \
            --log-level info > server.log 2>&1 &
          echo $! > server.pid
          sleep 3
          if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "::error::MCP server died at startup"; tail -40 server.log; exit 1
          fi
          echo "--- local check (expect 200) ---"
          curl -s -o /dev/null -w "127.0.0.1:${MCP_PORT}/mcp -> HTTP %{http_code}\n" \
            -X POST "http://127.0.0.1:${MCP_PORT}/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"wf","version":"1"}}}'

          # --- open the tunnel (bounded retries: a stale lease can linger) ---
          READY=0
          for attempt in 1 2 3; do
            : > linkpulse.log
            nohup ./linkpulse http "$MCP_PORT" \
              -u "$SUB" --no-dashboard --log-level INFO > linkpulse.log 2>&1 &
            echo $! > linkpulse.pid
            for _ in $(seq 1 30); do
              grep -q "HTTP tunnel ready" linkpulse.log && { READY=1; break; }
              grep -q "already in use"    linkpulse.log && break
              sleep 2
            done
            [ "$READY" = "1" ] && break
            echo "--- attempt $attempt did not come up ---"; cat linkpulse.log
            kill "$(cat linkpulse.pid)" 2>/dev/null || true
            kill -0 "$(cat server.pid)" 2>/dev/null || { echo "::error::MCP server died"; tail -40 server.log; exit 1; }
            sleep 10
          done
          cat linkpulse.log
          if [ "$READY" != "1" ]; then
            if grep -q "already in use" linkpulse.log; then
              echo "::error::Subdomain '${SUB}' is already held by another LinkPulse client. Re-run with a different 'subdomain' input (or stop the client holding it)."
            else
              echo "::error::LinkPulse tunnel never became ready."
            fi
            exit 1
          fi

          # --- verify the PUBLIC endpoint carries MCP -----------------------
          # Note: LinkPulse keeps the process alive even when a subdomain is
          # refused, so the public round-trip is the only trustworthy check.
          CODE=000
          for _ in $(seq 1 12); do
            CODE=$(curl -s -o public.txt -w '%{http_code}' --max-time 25 \
              -X POST "${PUBLIC_URL}/mcp" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"wf-verify","version":"1"}}}' || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          echo "public initialize -> HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::error::Public endpoint ${PUBLIC_URL}/mcp did not answer an MCP initialize (got ${CODE})"
            head -c 400 public.txt || true
            tail -20 linkpulse.log
            exit 1
          fi
          echo "::notice::Public MCP endpoint is live and verified: ${PUBLIC_URL}/mcp"

          # --- summary ------------------------------------------------------
          {
            echo "## Remote MCP shell is up (no auth)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| MCP endpoint | \`${PUBLIC_URL}/mcp\` |"
            echo "| Auth | **none** (\`--no-auth\`) |"
            echo "| Tunnel | LinkPulse ${LINKPULSE_VERSION} -> \`${SERVER}\` |"
            echo "| Subdomain | \`${SUB}\` |"
            echo "| Runner | $(nproc) vCPU / $(free -g | awk '/Mem:/{print $2}') GB RAM |"
            echo "| Disk | $(df -h . | awk 'NR==2{print $2" total, "$4" free"}') |"
            echo "| JDK | $(java -version 2>&1 | head -1) |"
            echo "| Gradle | $(gradle -v 2>/dev/null | awk '/^Gradle /{print $2; exit}') |"
            echo "| Android SDK | \`${ANDROID_HOME:-unset}\` |"
            echo "| Android NDK | \`${ANDROID_NDK_LATEST_HOME:-unset}\` |"
            echo
            echo "Client config:"
            echo '```json'
            echo '{ "mcpServers": { "actions-runner": { "type": "http", "url": "'"${PUBLIC_URL}"'/mcp" } } }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${NOTIFY,,}" = "true" ] && [ -n "${WEBHOOK:-}" ]; then
            curl -sf --max-time 10 -X POST "$WEBHOOK" \
              -H 'Content-Type: application/json' \
              --data "$(printf '{"description":"Actions runner READY - MCP shell (no auth): %s/mcp"}' "$PUBLIC_URL")" \
              || echo "webhook notification failed (continuing)"
          fi

      - name: Show Android toolchain
        run: |
          echo "cores=$(nproc)  ram=$(free -g | awk '/Mem:/{print $2}')GB"
          df -h . | tail -1
          (java -version 2>&1 | head -2) || true
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}"
          (gradle -v 2>/dev/null | awk '/^Gradle /{print; exit}') || true
          ls "${ANDROID_HOME:-/nonexistent}/platforms" 2>/dev/null | tail -8 || true

      - name: Keep the runner alive
        env:
          MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            kill -0 "$(cat ws/server.pid)"   2>/dev/null || { echo "MCP server died:";   tail -40 ws/server.log;   exit 1; }
            kill -0 "$(cat ws/linkpulse.pid)" 2>/dev/null || { echo "LinkPulse died:";   tail -40 ws/linkpulse.log; exit 1; }
            sleep 30
          done
          echo "duration reached; shutting down"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-shell-mcp-logs
          path: |
            ws/server.log
            ws/linkpulse.log
          if-no-files-found: ignore
          retention-days: 1
