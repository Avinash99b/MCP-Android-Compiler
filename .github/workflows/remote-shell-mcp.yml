# ---------------------------------------------------------------------------
# Temporary remote MCP shell on a GitHub-hosted runner  (LinkPulse edition)
#
# Repo:   github.com/Avinash99b/MCP-Android-Compiler
# Serve:  github.com/Avinash99b/Remote-Shell-MCP   (mcp_shell_server.py)
# Tunnel: github.com/Avinash99b/LinkPulse          (my_proxy client) - NOT cloudflare
#
# FLOW
#   0. The runner prepares itself before anything opens a network connection:
#      a) The LinkPulse client is installed SYSTEM-WIDE at /usr/local/bin/linkpulse,
#         checksum-verified against the pinned LINKPULSE_SHA256 in `env` below. No
#         step downloads it any more, and the interactive shell gets the same
#         binary at the same path - so a tunnel you open by hand can never be a
#         different version from the one this workflow relies on.
#      b) If SSH_PRIVATE_KEY is set it is written to ~/.ssh, github.com host keys
#         are pinned from api.github.com/meta, the key is proven with a real
#         `ssh -T git@github.com`, and (optionally) https://github.com/ remotes
#         are rewritten to SSH. Never fatal: without a working key the job
#         continues over HTTPS.
#   1. Runner starts: Linux 4 vCPU / 16 GB RAM / 14 GB SSD. Free + unlimited
#      minutes on PUBLIC repositories.
#   2. Remote-Shell-MCP is started on 127.0.0.1:8765 with `--no-auth`
#      (explicitly requested: no bearer token).
#   3. The LinkPulse client opens an OUTBOUND-only multiplexed connection to
#      the LinkPulse control server and requests the fixed subdomain from the
#      `subdomain` input. Result: https://<subdomain>.<domain>/mcp
#      REQUIRED because GitHub-hosted runners have NO inbound endpoint at all.
#   4. The public URL is verified end-to-end with a real MCP `initialize` POST.
#   5. The URL is pushed to your phone (MacroDroid webhook) + job summary.
#   6. The job idles for `duration_minutes`. GitHub hard-kills hosted jobs at
#      360 minutes, so the workflow caps itself at 355.
#
# SECRETS (never committed - set in repo Settings > Secrets and variables > Actions)
#   LINKPULSE_TOKEN           REQUIRED  shared secret of the LinkPulse control server
#   LINKPULSE_SERVER          REQUIRED  control server as host:port, e.g. tunnel.example.com:9000
#                                       The public domain is derived from the host part, so no
#                                       hostname is ever committed to this repository.
#   MACRODROID_WEBHOOK_URL    optional  phone notifications for the URL
#   SSH_PRIVATE_KEY           optional  OpenSSH/PEM private key installed into the runner's
#                                       ~/.ssh, so this workflow and the interactive shell
#                                       authenticate to GitHub over SSH (git@github.com:).
#                                       Must be UNENCRYPTED - there is no way to type a
#                                       passphrase non-interactively on a hosted runner.
#
# SECURITY NOTE (deliberate, per owner's request): the MCP endpoint is exposed
# WITHOUT authentication on a FIXED, guessable hostname. Anyone who knows the
# URL gets a shell on the runner. Keep sessions short and delete run logs.
#
# Now that this workflow can also install SSH_PRIVATE_KEY, that shell additionally holds
# whatever that key can reach on GitHub - a strictly larger blast radius than before.
# Use a key dedicated to this job (not your primary identity) and rotate it.
# ---------------------------------------------------------------------------

name: remote-shell-mcp

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Minutes to keep the runner alive (max 350; GitHub kills hosted jobs at 360)"
        required: true
        default: "120"
      subdomain:
        description: "LinkPulse subdomain to request (must be free; becomes https://<sub>.<domain>)"
        required: true
        default: "mcp-android-compiler"
      notify_phone:
        description: "Send the public URL to the MacroDroid webhook"
        type: boolean
        default: true
      git_ssh_rewrite:
        description: "Rewrite https://github.com/ remotes to git@github.com: so every git command in the shell uses SSH_PRIVATE_KEY. Ignored when no key is installed."
        type: boolean
        default: true

# One runner at a time: a fixed subdomain can only be held by one client.
concurrency:
  group: remote-shell-mcp
  cancel-in-progress: false

# The exposed shell runs with --no-auth, so it must not hold any GitHub credential.
permissions: {}

env:
  # ---------------------------------------------------------------------------
  # LinkPulse client - installed SYSTEM-WIDE as /usr/local/bin/linkpulse by the
  # first custom step, so later steps and the interactive MCP shell session can
  # simply call `linkpulse` (no relative path, no per-step download).
  #
  # Bump LINKPULSE_VERSION and LINKPULSE_SHA256 TOGETHER. The hash is pinned here
  # rather than read from the release, because a checksum shipped inside the
  # artefact it describes only catches corruption, never tampering.
  #   v0.1.4   7995608 B   <- pinned; what every successful run so far used
  #   v1.0.0   8044176 B   <- newer, but its default is `--lease` OFF (handoff
  #                           mode), which would silently TAKE OVER the fixed
  #                           subdomain instead of failing with "already in use".
  #                           The collision handling below greps for that string,
  #                           so revisit it before bumping.  sha256:
  #                           fcd16cb86d454adb75a94913651f6d09def3abd33252875ebee659512114ab3b
  # ---------------------------------------------------------------------------
  LINKPULSE_VERSION: v0.1.4
  LINKPULSE_SHA256: c264cdc0ead280ae51fdd46d1c30d7a2e810e1a29ee3eeb1052ad06794f7d3c9
  MCP_PORT: "8765"

jobs:
  serve:
    runs-on: ubuntu-latest        # ubuntu-slim = 1 CPU unprivileged container, minimal image
    timeout-minutes: 355          # < the 360-minute hard limit for GitHub-hosted jobs

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LinkPulse system-wide
        id: linkpulse
        run: |
          #!/usr/bin/env bash
          # ---------------------------------------------------------------------------
          # Installs the LinkPulse client (my_proxy) SYSTEM-WIDE as /usr/local/bin/linkpulse,
          # so every later workflow step AND the interactive MCP shell session can just call
          # `linkpulse` - no relative path, no per-step download, no version drift between
          # the tunnel the workflow opens and the tunnels you open by hand from the shell.
          #
          # Integrity is checked against a SHA-256 PINNED IN THIS WORKFLOW, not against a
          # checksum file served by the same release it is meant to protect: a checksum that
          # travels with the artefact only detects corruption, never tampering.
          # ---------------------------------------------------------------------------
          set -euo pipefail

          DEST="${LINKPULSE_DEST:-/usr/local/bin/linkpulse}"
          ASSET="my_proxy-linux-amd64"
          URL="https://github.com/Avinash99b/LinkPulse/releases/download/${LINKPULSE_VERSION}/${ASSET}"

          # sudo only when needed - the hosted runner is non-root, a root container is not.
          SUDO=()
          [ "$(id -u)" -ne 0 ] && SUDO=(sudo)

          echo "release : ${LINKPULSE_VERSION}"
          echo "asset   : ${ASSET}"
          echo "target  : ${DEST}"

          SKIPPED=false
          if [ -x "$DEST" ] && [ -n "${LINKPULSE_SHA256:-}" ] \
             && printf '%s  %s\n' "$LINKPULSE_SHA256" "$DEST" | sha256sum -c --status 2>/dev/null; then
            SKIPPED=true
            echo "${DEST} is already installed and matches the pinned checksum - skipping download"
          fi

          if [ "$SKIPPED" != true ]; then
            TMP="$(mktemp -d)"
            trap 'rm -rf "$TMP"' EXIT

            curl -fsSL --retry 3 --retry-delay 2 --max-time 180 -o "$TMP/$ASSET" "$URL"
            echo "downloaded: $(stat -c%s "$TMP/$ASSET") bytes"

            # --- integrity ----------------------------------------------------------
            ACTUAL="$(sha256sum "$TMP/$ASSET" | awk '{print $1}')"
            echo "sha256  : $ACTUAL"
            if [ -z "${LINKPULSE_SHA256:-}" ]; then
              printf '::warning::LINKPULSE_SHA256 is not set - installing %s WITHOUT integrity verification. Pin the hash in this workflow.\n' "$LINKPULSE_VERSION"
            elif [ "$ACTUAL" != "$LINKPULSE_SHA256" ]; then
              printf '::error::Checksum mismatch for %s (%s) - refusing to install.\n  expected: %s\n  actual  : %s\nIf you bumped LINKPULSE_VERSION, update LINKPULSE_SHA256 in this workflow to the hash of the new asset.\n' \
                "$ASSET" "$LINKPULSE_VERSION" "$LINKPULSE_SHA256" "$ACTUAL"
              exit 1
            else
              echo "checksum verified against the pinned LINKPULSE_SHA256"
            fi

            # --- sanity: a real x86-64 ELF, not an HTML error page ------------------
            MAGIC="$(head -c 4 "$TMP/$ASSET" | od -An -tx1 | tr -d ' \n')"
            if [ "$MAGIC" != "7f454c46" ]; then
              echo "::error::$ASSET is not an ELF binary (magic=$MAGIC); first bytes follow:"
              head -c 200 "$TMP/$ASSET" || true
              exit 1
            fi
            echo "ELF magic ok"

            # /usr/local/bin is on the runner's default PATH (root-owned normally; on this
            # image it is 0777, but sudo install works either way).
            "${SUDO[@]}" install -d -m 0755 "$(dirname "$DEST")"
            "${SUDO[@]}" install -m 0755 -o root -g root "$TMP/$ASSET" "$DEST"
            echo "installed: $(ls -l "$DEST")"
          fi

          # --- prove it resolves and runs from a directory unrelated to it -----------
          cd /
          BIN="$(command -v linkpulse || true)"
          if [ -z "$BIN" ]; then
            echo "::error::$DEST was installed but is not on PATH (PATH=$PATH)"
            exit 1
          fi
          if ! linkpulse --help >/dev/null 2>&1; then
            echo "::error::linkpulse resolves to $BIN but 'linkpulse --help' fails"
            exit 1
          fi
          echo "linkpulse resolves on PATH to $BIN and runs"

          {
            echo "LINKPULSE_BIN=$BIN"
            echo "LINKPULSE_INSTALLED_VERSION=${LINKPULSE_VERSION}"
          } >> "$GITHUB_ENV"

          {
            echo "### LinkPulse installed system-wide"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| binary | \`${BIN}\` |"
            echo "| release | ${LINKPULSE_VERSION} |"
            echo "| sha256 | \`${LINKPULSE_SHA256:-unverified}\` |"
            echo "| available to the shell | yes - \`linkpulse\` on PATH |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install GitHub SSH key (optional)
        id: ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REWRITE: ${{ inputs.git_ssh_rewrite }}
        run: |
          #!/usr/bin/env bash
          # ---------------------------------------------------------------------------
          # Installs the GitHub SSH private key (repo secret SSH_PRIVATE_KEY) into the
          # runner's ~/.ssh, so this workflow's own clones AND the whole MCP shell session
          # can talk to GitHub over SSH - no PAT, no `contents: write` token scope.
          #
          # Never fatal by design: a missing/broken key degrades to HTTPS-only instead of
          # costing a run. That is why errexit is cleared explicitly below - see the note.
          # ---------------------------------------------------------------------------

          # GitHub runs a `run:` step as  bash --noprofile --norc -eo pipefail step.sh ,
          # and -e inherited from the command line is NOT cancelled by a later `set -u`:
          # it has to be turned off explicitly. (First version of this step shipped without
          # this line and died at `AUTH="$(ssh -T git@github.com)"`, because ssh -T exits 1
          # even on SUCCESSFUL auth - GitHub returns non-zero since it grants no shell.)
          set +e -uo pipefail

          KEY_READY=false
          KEY_REASON="SSH_PRIVATE_KEY is not set (optional secret)"
          LOGIN=""; KEY_NAME=""; KEY_TYPE=""; KEY_FP=""; KEY_ENC=""; HOST_KEYS_SRC="unavailable"
          REWRITE_EFFECTIVE="${REWRITE:-false}"
          KEY_DISPLAY="n/a"

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            printf '::warning::%s - the shell will have no GitHub SSH credential (HTTPS/anonymous only).\n' "$KEY_REASON"
          else
            install -d -m 700 "$HOME/.ssh"; chmod 700 "$HOME/.ssh"

            # A secret pasted from a phone often arrives as ONE line with literal \n
            # separators, CRLF endings, or wrapped in quotes. Normalise first.
            if ! python3 - <<'PY'
          import os, pathlib
          raw = os.environ.get("SSH_PRIVATE_KEY", "")
          if "\n" not in raw and "\\n" in raw:
              raw = raw.replace("\\r", "").replace("\\n", "\n")
          raw = raw.replace("\r\n", "\n").replace("\r", "\n").strip()
          if len(raw) > 1 and raw[0] == raw[-1] == '"':
              raw = raw[1:-1]
          p = pathlib.Path.home() / ".ssh" / "staged_key"
          p.write_text(raw + "\n")
          p.chmod(0o600)
          print("staged %d bytes of key material" % (len(raw) + 1))
          PY
            then
              KEY_REASON="could not normalise the secret"
              printf '::error::SSH_PRIVATE_KEY %s.\n' "$KEY_REASON"
            fi

            STAGED="$HOME/.ssh/staged_key"
            if [ ! -f "$STAGED" ]; then
              :
            elif ! grep -q -- 'PRIVATE KEY-----' "$STAGED"; then
              rm -f "$STAGED"
              KEY_REASON="the secret does not contain a PEM/OpenSSH private-key block (did you paste the .pub by mistake?)"
              printf '::error::SSH_PRIVATE_KEY %s - GitHub SSH auth stays OFF.\n' "$KEY_REASON"
            else
              # OpenSSH-format keys embed their public half, so -lf works even for a
              # passphrase-protected key; `-y -P ''` does not, and is how we detect one.
              KEY_FP_LINE="$(ssh-keygen -lf "$STAGED" 2>/dev/null)" || KEY_FP_LINE=""
              if [ -z "$KEY_FP_LINE" ]; then
                rm -f "$STAGED"
                KEY_REASON="ssh-keygen could not parse the key (corrupt or unsupported format)"
                printf '::error::SSH_PRIVATE_KEY is unreadable: %s - GitHub SSH auth stays OFF.\n' "$KEY_REASON"
              else
                KEY_FP="$(printf '%s' "$KEY_FP_LINE" | awk '{print $2}')" || KEY_FP=""
                KEY_TYPE="$(printf '%s' "$KEY_FP_LINE" | awk '{print $NF}' | tr -d '()')" || KEY_TYPE=""
                case "$KEY_TYPE" in
                  ED25519) KEY_NAME=id_ed25519 ;;
                  RSA)     KEY_NAME=id_rsa ;;
                  ECDSA)   KEY_NAME=id_ecdsa ;;
                  *)       KEY_NAME="id_$(printf '%s' "$KEY_TYPE" | tr 'A-Z' 'a-z')" ;;
                esac
                mv -f "$STAGED" "$HOME/.ssh/$KEY_NAME"
                chmod 600 "$HOME/.ssh/$KEY_NAME"
                if ssh-keygen -y -P '' -f "$HOME/.ssh/$KEY_NAME" > "$HOME/.ssh/$KEY_NAME.pub" 2>/dev/null; then
                  chmod 644 "$HOME/.ssh/$KEY_NAME.pub"; KEY_ENC=no
                else
                  rm -f "$HOME/.ssh/$KEY_NAME.pub"; KEY_ENC=yes
                fi

                # --- pin github.com host keys from GitHub's authoritative HTTPS endpoint
                KH="$HOME/.ssh/known_hosts"
                rm -f "$KH"
                if curl -fsS --max-time 20 https://api.github.com/meta 2>/dev/null \
                     | python3 -c 'import json,sys
          try:
              keys = json.load(sys.stdin)["ssh_keys"]
          except Exception:
              sys.exit(1)          # empty/garbage body: let the ssh-keyscan fallback run quietly
          sys.stdout.write("".join("github.com %s\n" % k for k in keys))' > "$KH" \
                   && [ -s "$KH" ]; then
                  HOST_KEYS_SRC="api.github.com/meta"
                  if ssh-keygen -lf "$KH" 2>/dev/null \
                       | grep -q 'SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU'; then
                    printf 'github.com host keys pinned from api.github.com/meta (ed25519 fingerprint verified)\n'
                  else
                    printf '::warning::github.com ed25519 host key is NOT the well-known SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU - keys may have been rotated; re-verify before trusting this runner.\n'
                  fi
                else
                  printf '::warning::Could not fetch github.com host keys from api.github.com/meta; falling back to ssh-keyscan (trust-on-first-use).\n'
                  ssh-keyscan -T 10 -t ed25519,rsa,ecdsa github.com > "$KH" 2>/dev/null || true
                  { [ -s "$KH" ] && HOST_KEYS_SRC="ssh-keyscan (TOFU)"; } || true
                fi
                chmod 600 "$KH" 2>/dev/null || true

                # Absolute paths: OpenSSH resolves `~` from the passwd database, not $HOME.
                KEY_DISPLAY="~/.ssh/$KEY_NAME"
                if [ -s "$KH" ]; then STRICT=yes; else STRICT=accept-new; fi
                cat > "$HOME/.ssh/config" <<CFG
          Host github.com
            HostName github.com
            User git
            IdentitiesOnly yes
            IdentityFile $HOME/.ssh/$KEY_NAME
            UserKnownHostsFile $KH
            StrictHostKeyChecking $STRICT
            ServerAliveInterval 30
          CFG
                chmod 600 "$HOME/.ssh/config" 2>/dev/null || true

                # --- prove THIS key works, with nothing ambient able to stand in for it
                # `|| true` is load-bearing twice over: ssh -T exits 1 on success, and
                # pipefail would otherwise surface a SIGPIPE from `head` below.
                AUTH="$(ssh -F /dev/null -T -o BatchMode=yes -o ConnectTimeout=15 \
                          -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
                          -o IdentitiesOnly=yes -o "IdentityFile=$HOME/.ssh/$KEY_NAME" \
                          -o "UserKnownHostsFile=$KH" -o "StrictHostKeyChecking=$STRICT" \
                          git@github.com 2>&1 | tr -d '\r')" || true
                LOGIN="$(printf '%s\n' "$AUTH" | sed -n 's/^Hi \([^!]\{1,\}\)!.*/\1/p' | head -1)" || LOGIN=""
                if [ -z "$LOGIN" ]; then
                  KEY_REASON="github.com refused the key: $(printf '%s' "$AUTH" | head -1)"
                  [ "$KEY_ENC" = yes ] && KEY_REASON="the key is passphrase-protected, so it cannot be used non-interactively: strip the passphrase (ssh-keygen -p) or use a dedicated key"
                  printf '::error::~/.ssh/%s installed but did not authenticate (not fatal). %s\n' "$KEY_NAME" "$KEY_REASON"
                else
                  KEY_READY=true
                  KEY_REASON="authenticated as $LOGIN"
                  printf '::notice::GitHub SSH key is live at ~/.ssh/%s - anyone who reaches this no-auth MCP endpoint can use it. Keep this key narrowly scoped and rotate it.\n' "$KEY_NAME"
                  printf 'authenticated to github.com as %s (%s %s)\n' "$LOGIN" "$KEY_TYPE" "$KEY_FP"
                  OWNER="${LOGIN%%/*}"
                  if [ "$LOGIN" = "$OWNER" ]; then
                    git config --global user.name  "$OWNER" && git config --global user.email "${OWNER}@users.noreply.github.com" && \
                      printf 'git commit identity: %s <%s@users.noreply.github.com>\n' "$OWNER" "$OWNER"
                  else
                    # A deploy key only grants this key access to ONE repository, so
                    # rewriting every https GitHub URL would break unrelated clones.
                    REWRITE_EFFECTIVE=false
                    printf '::notice::Deploy key scoped to %s detected - https->ssh rewrite forced OFF so other repos keep working.\n' "$LOGIN"
                  fi
                  if [ "$REWRITE_EFFECTIVE" = "true" ]; then
                    git config --global url."git@github.com:".insteadOf "https://github.com/" && \
                      printf 'https://github.com/ remotes are rewritten to git@github.com: (SSH)\n'
                  else
                    printf 'https://github.com/ remotes are left alone (git_ssh_rewrite=%s)\n' "${REWRITE:-false}"
                  fi
                fi
              fi
            fi
          fi

          if [ "$KEY_READY" != "true" ]; then REWRITE_EFFECTIVE=false; fi

          {
            echo "SSH_KEY_READY=$KEY_READY"
            echo "SSH_KEY_REASON=$KEY_REASON"
            echo "SSH_LOGIN=${LOGIN:-}"
            echo "SSH_KEY_NAME=$KEY_NAME"
            echo "SSH_KEY_FINGERPRINT=$KEY_FP"
            echo "SSH_KEY_TYPE=$KEY_TYPE"
            echo "SSH_KEY_ENCRYPTED=$KEY_ENC"
            echo "SSH_HOST_KEYS=$HOST_KEYS_SRC"
            echo "SSH_REWRITE=$REWRITE_EFFECTIVE"
          } >> "$GITHUB_ENV"

          {
            echo "### GitHub SSH auth"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| authenticated | **${KEY_READY}** |"
            echo "| detail | ${KEY_REASON} |"
            echo "| key file | \`${KEY_DISPLAY}\` |"
            echo "| fingerprint | \`${KEY_FP:-n/a}\` |"
            echo "| host keys | ${HOST_KEYS_SRC} |"
            echo "| https -> ssh rewrite | ${REWRITE_EFFECTIVE} |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Non-fatal by design: never fail the job on a credential problem.
          exit 0
      - name: Start MCP server (--no-auth) and LinkPulse tunnel
        id: tunnel
        env:
          LINKPULSE_TOKEN: ${{ secrets.LINKPULSE_TOKEN }}
          LINKPULSE_SERVER: ${{ secrets.LINKPULSE_SERVER }}
          NOTIFY: ${{ inputs.notify_phone }}
          WEBHOOK: ${{ secrets.MACRODROID_WEBHOOK_URL }}
          SUB_INPUT: ${{ inputs.subdomain }}
        run: |
          set -euo pipefail
          mkdir -p ws && cd ws

          missing=""
          [ -z "${LINKPULSE_SERVER:-}" ] && missing="$missing LINKPULSE_SERVER"
          [ -z "${LINKPULSE_TOKEN:-}"  ] && missing="$missing LINKPULSE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing - add under Settings > Secrets and variables > Actions."
            exit 1
          fi

          # --- server/domain resolution -------------------------------------
          SERVER="$LINKPULSE_SERVER"
          case "$SERVER" in *:*) ;; *) SERVER="${SERVER}:9000" ;; esac   # default control port
          DOMAIN="${SERVER%%:*}"                    # public domain, derived - never hardcoded
          SUB="${SUB_INPUT:-mcp-android-compiler}"
          PUBLIC_URL="https://${SUB}.${DOMAIN}"
          echo "control server : $SERVER"
          echo "public URL     : $PUBLIC_URL/mcp"
          echo "public_url=$PUBLIC_URL" >> "$GITHUB_OUTPUT"

          # --- LinkPulse client ---------------------------------------------
          # Installed system-wide by the "Install LinkPulse system-wide" step; nothing
          # is downloaded here any more. Resolve it from PATH so the tunnel this step
          # opens and any tunnel opened by hand in the MCP shell are the same binary.
          LINKPULSE_BIN="${LINKPULSE_BIN:-$(command -v linkpulse || true)}"
          if [ -z "${LINKPULSE_BIN:-}" ] || [ ! -x "$LINKPULSE_BIN" ]; then
            echo "::error::linkpulse not found on PATH - the install step did not run or failed."
            exit 1
          fi
          if ! "$LINKPULSE_BIN" --help >/dev/null 2>&1; then
            echo "::error::$LINKPULSE_BIN exists but is not runnable."
            exit 1
          fi
          echo "using LinkPulse: $LINKPULSE_BIN"
          export MY_PROXY_SERVER="$SERVER"
          export MY_PROXY_TOKEN="$LINKPULSE_TOKEN"

          # --- Remote-Shell-MCP, no auth ------------------------------------
          # Prefer SSH when the key above works (which also proves it end-to-end);
          # fall back to anonymous HTTPS so a stale key can never cost you a run.
          if [ "${SSH_KEY_READY:-false}" = "true" ] &&
             git clone --depth 1 git@github.com:Avinash99b/Remote-Shell-MCP.git server 2>&1; then
            echo "cloned Remote-Shell-MCP over SSH (git@github.com:)"
          else
            rm -rf server
            echo "::notice::SSH clone unavailable - falling back to anonymous HTTPS"
            # GIT_CONFIG_*=/dev/null neutralises the https->ssh rewrite, which would
            # otherwise re-route this fallback straight back onto the broken SSH path.
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
              git clone --depth 1 https://github.com/Avinash99b/Remote-Shell-MCP.git server
          fi
          python3 -m venv .venv
          ./.venv/bin/pip install --quiet --disable-pip-version-check -r server/requirements.txt

          nohup ./.venv/bin/python server/mcp_shell_server.py \
            --host 127.0.0.1 --port "$MCP_PORT" \
            --no-auth \
            --allowed-host "${SUB}.${DOMAIN}" \
            --cwd "$PWD" \
            --log-level info > server.log 2>&1 &
          echo $! > server.pid
          sleep 3
          if ! kill -0 "$(cat server.pid)" 2>/dev/null; then
            echo "::error::MCP server died at startup"; tail -40 server.log; exit 1
          fi
          echo "--- local check (expect 200) ---"
          curl -s -o /dev/null -w "127.0.0.1:${MCP_PORT}/mcp -> HTTP %{http_code}\n" \
            -X POST "http://127.0.0.1:${MCP_PORT}/mcp" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"wf","version":"1"}}}'

          # --- open the tunnel (bounded retries: a stale lease can linger) ---
          READY=0
          for attempt in 1 2 3; do
            : > linkpulse.log
            nohup "$LINKPULSE_BIN" http "$MCP_PORT" \
              -u "$SUB" --no-dashboard --log-level INFO > linkpulse.log 2>&1 &
            echo $! > linkpulse.pid
            for _ in $(seq 1 30); do
              grep -q "HTTP tunnel ready" linkpulse.log && { READY=1; break; }
              grep -q "already in use"    linkpulse.log && break
              sleep 2
            done
            [ "$READY" = "1" ] && break
            echo "--- attempt $attempt did not come up ---"; cat linkpulse.log
            kill "$(cat linkpulse.pid)" 2>/dev/null || true
            kill -0 "$(cat server.pid)" 2>/dev/null || { echo "::error::MCP server died"; tail -40 server.log; exit 1; }
            sleep 10
          done
          cat linkpulse.log
          if [ "$READY" != "1" ]; then
            if grep -q "already in use" linkpulse.log; then
              echo "::error::Subdomain '${SUB}' is already held by another LinkPulse client. Re-run with a different 'subdomain' input (or stop the client holding it)."
            else
              echo "::error::LinkPulse tunnel never became ready."
            fi
            exit 1
          fi

          # --- verify the PUBLIC endpoint carries MCP -----------------------
          # Note: LinkPulse keeps the process alive even when a subdomain is
          # refused, so the public round-trip is the only trustworthy check.
          CODE=000
          for _ in $(seq 1 12); do
            CODE=$(curl -s -o public.txt -w '%{http_code}' --max-time 25 \
              -X POST "${PUBLIC_URL}/mcp" \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"wf-verify","version":"1"}}}' || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          echo "public initialize -> HTTP ${CODE}"
          if [ "$CODE" != "200" ]; then
            echo "::error::Public endpoint ${PUBLIC_URL}/mcp did not answer an MCP initialize (got ${CODE})"
            head -c 400 public.txt || true
            tail -20 linkpulse.log
            exit 1
          fi
          echo "::notice::Public MCP endpoint is live and verified: ${PUBLIC_URL}/mcp"

          # --- summary ------------------------------------------------------
          {
            echo "## Remote MCP shell is up (no auth)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| MCP endpoint | \`${PUBLIC_URL}/mcp\` |"
            echo "| Auth | **none** (\`--no-auth\`) |"
            echo "| Tunnel | LinkPulse ${LINKPULSE_INSTALLED_VERSION:-$LINKPULSE_VERSION} (\`${LINKPULSE_BIN:-linkpulse}\`) -> \`${SERVER}\` |"
            echo "| Subdomain | \`${SUB}\` |"
            echo "| GitHub SSH | \`${SSH_LOGIN:-none}\` key-ready: \`${SSH_KEY_READY:-false}\` https->ssh: \`${SSH_REWRITE:-false}\` |"
            echo "| Runner | $(nproc) vCPU / $(free -g | awk '/Mem:/{print $2}') GB RAM |"
            echo "| Disk | $(df -h . | awk 'NR==2{print $2" total, "$4" free"}') |"
            echo "| JDK | $(java -version 2>&1 | head -1) |"
            echo "| Gradle | $(gradle -v 2>/dev/null | awk '/^Gradle /{print $2; exit}') |"
            echo "| Android SDK | \`${ANDROID_HOME:-unset}\` |"
            echo "| Android NDK | \`${ANDROID_NDK_LATEST_HOME:-unset}\` |"
            echo
            echo "Client config:"
            echo '```json'
            echo '{ "mcpServers": { "actions-runner": { "type": "http", "url": "'"${PUBLIC_URL}"'/mcp" } } }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${NOTIFY,,}" = "true" ] && [ -n "${WEBHOOK:-}" ]; then
            curl -sf --max-time 10 -X POST "$WEBHOOK" \
              -H 'Content-Type: application/json' \
              --data "$(printf '{"description":"Actions runner READY - MCP shell (no auth): %s/mcp"}' "$PUBLIC_URL")" \
              || echo "webhook notification failed (continuing)"
          fi

      - name: Show Android toolchain
        run: |
          echo "cores=$(nproc)  ram=$(free -g | awk '/Mem:/{print $2}')GB"
          df -h . | tail -1
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          echo "JAVA_HOME_17_X64=${JAVA_HOME_17_X64:-unset}"
          (java -version 2>&1 | head -2) || true
          echo "NOTE: ubuntu-latest is Ubuntu 26.04; default JDK is 25. For AGP, build with"
          echo "      export JAVA_HOME=\$JAVA_HOME_17_X64"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "ANDROID_NDK_LATEST_HOME=${ANDROID_NDK_LATEST_HOME:-unset}"
          (gradle -v 2>/dev/null | awk '/^Gradle /{print; exit}') || true
          ls "${ANDROID_HOME:-/nonexistent}/platforms" 2>/dev/null | tail -8 || true

      - name: Keep the runner alive
        env:
          MINUTES: ${{ inputs.duration_minutes }}
        run: |
          set -euo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            kill -0 "$(cat ws/server.pid)"   2>/dev/null || { echo "MCP server died:";   tail -40 ws/server.log;   exit 1; }
            kill -0 "$(cat ws/linkpulse.pid)" 2>/dev/null || { echo "LinkPulse died:";   tail -40 ws/linkpulse.log; exit 1; }
            sleep 30
          done
          echo "duration reached; shutting down"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-shell-mcp-logs
          path: |
            ws/server.log
            ws/linkpulse.log
          if-no-files-found: ignore
          retention-days: 1
